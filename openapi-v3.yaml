                              - icp
                              - messaging
                              - offer
                              - constraint
                              - resource
                          slug:
                            type: string
                            minLength: 1
                            description: The entry's slug, as entries.list returns it
                          title:
                            type: string
                            minLength: 1
                            maxLength: 80
                          body:
                            type: string
                          data:
                            type: object
                            additionalProperties: {}
