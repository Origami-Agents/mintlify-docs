          sidebarTitle: "Templates patch"
          description: "Edit a template \u2014 a shared template's steps, campaign spans, needs, written_for and sign-off; a campaign template's fills, new spans, needs and written_for. On a launched campaign it lands on the draft"
      operationId: send.templates.patch
      summary: "Edit a template \u2014 a shared template's steps, campaign spans, needs, written_for and sign-off; a campaign template's fills, new spans, needs and written_for. On a launched campaign it lands on the draft"
      tags:
        - send
      parameters:
        - name: template
          in: path
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 200
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                expected_version:
                  type: integer
                  minimum: 1
                expected_draft_saved_at:
                  type: string
                  minLength: 1
                  maxLength: 64
                  nullable: true
                steps:
                  type: array
                  items:
                    type: object
                    properties:
                      channel:
                        type: string
                        enum:
                          - email
                          - linkedin_message
                          - linkedin_voice_note
                          - linkedin_connect
                          - linkedin_comment
                          - linkedin_react
                          - manual
                      subject:
                        type: string
                        maxLength: 300
                      body:
                        type: string
                        maxLength: 20000
                      delay_days:
                        type: integer
                        minimum: 0
                        maximum: 30
                      personalized:
                        type: array
                        items:
                          anyOf:
                            - type: string
                              minLength: 1
                            - type: object
                              properties:
                                text:
                                  type: string
                                  minLength: 1
                                name:
                                  type: string
                                  minLength: 1
                                  maxLength: 80
                                instruction:
                                  type: string
                                  minLength: 1
                                  maxLength: 1000
                                field:
                                  type: string
                                  minLength: 1
                                  maxLength: 80
                                  nullable: true
                              required:
                                - text
                              additionalProperties: false
                        maxItems: 20
                      subject_personalized:
                        type: array
                        items:
                          anyOf:
                            - type: string
                              minLength: 1
                            - type: object
                              properties:
                                text:
                                  type: string
                                  minLength: 1
                                name:
                                  type: string
                                  minLength: 1
                                  maxLength: 80
                                instruction:
                                  type: string
                                  minLength: 1
                                  maxLength: 1000
                                field:
                                  type: string
                                  minLength: 1
                                  maxLength: 80
                                  nullable: true
                              required:
                                - text
                              additionalProperties: false
                        maxItems: 20
                      target_post:
                        type: object
                        properties:
                          mode:
                            type: string
                            enum:
                              - latest
                              - alias
                              - writer_pick
                          alias:
                            type: string
                            pattern: ^post_[1-9][0-9]*$
                        required:
                          - mode
                        additionalProperties: false
                      on_missing_post:
                        type: string
                        enum:
                          - hold
                          - skip
                      reaction:
                        type: string
                        enum:
                          - like
                          - celebrate
                          - support
                          - love
                          - insightful
                          - funny
                      reaction_mode:
                        type: string
                        enum:
                          - fixed
                          - match_post
                      connection_wait_minutes:
                        type: integer
                        minimum: 1
                        maximum: 43200
                        nullable: true
                      voice_note:
                        anyOf:
                          - type: object
                            properties:
                              provider:
                                type: string
                                enum:
                                  - elevenLabs
                            required:
                              - provider
                            additionalProperties: false
                          - type: object
                            properties:
                              provider:
                                type: string
                                enum:
                                  - upload
                              file_id:
                                type: string
                                format: uuid
                              duration_ms:
                                type: integer
                                exclusiveMinimum: true
                                minimum: 0
                            required:
                              - provider
                              - file_id
                              - duration_ms
                            additionalProperties: false
                    required:
                      - channel
                      - body
                      - delay_days
                    additionalProperties: false
                  minItems: 1
                  maxItems: 15
                campaign_spans:
                  type: array
                  items:
                    type: object
                    properties:
                      id:
                        type: string
                        pattern: ^c[1-9][0-9]*$
                      label:
                        type: string
                        minLength: 1
                        maxLength: 60
                      description:
                        type: string
                        maxLength: 160
                      step_index:
                        type: integer
                        minimum: 0
                        maximum: 14
                      field:
                        type: string
                        enum:
                          - subject
                          - body
                      text:
                        type: string
                        minLength: 1
                      occurrence:
                        type: integer
                        minimum: 0
                    required:
                      - id
                      - label
                      - step_index
                      - field
                      - text
                      - occurrence
                    additionalProperties: false
                  maxItems: 60
                sign_off_phrase:
                  type: string
                  maxLength: 200
                  nullable: true
                fills:
                  type: object
                  additionalProperties:
                    type: object
                    properties:
                      text:
                        type: string
                        maxLength: 20000
                      personalized:
                        type: array
                        items:
                          anyOf:
                            - type: string
                              minLength: 1
                            - type: object
                              properties:
                                text:
                                  type: string
                                  minLength: 1
                                name:
                                  type: string
                                  minLength: 1
                                  maxLength: 80
                                instruction:
                                  type: string
                                  minLength: 1
                                  maxLength: 1000
                                field:
                                  type: string
                                  minLength: 1
                                  maxLength: 80
                                  nullable: true
                              required:
                                - text
                              additionalProperties: false
                        maxItems: 20
                    required:
                      - text
                    additionalProperties: false
                    nullable: true
                new_spans:
                  type: array
                  items:
                    type: object
                    properties:
                      step_index:
                        type: integer
                        minimum: 0
                        maximum: 14
                      field:
                        type: string
                        enum:
                          - subject
                          - body
                      text:
                        type: string
                        minLength: 1
                      occurrence:
                        type: integer
                        minimum: 0
                      label:
                        type: string
                        minLength: 1
                        maxLength: 60
                      description:
                        type: string
                        maxLength: 160
                      fill:
                        type: object
                        properties:
                          text:
                            type: string
                            maxLength: 20000
                          personalized:
                            type: array
                            items:
                              anyOf:
                                - type: string
                                  minLength: 1
                                - type: object
                                  properties:
                                    text:
                                      type: string
                                      minLength: 1
                                    name:
                                      type: string
                                      minLength: 1
                                      maxLength: 80
                                    instruction:
                                      type: string
                                      minLength: 1
                                      maxLength: 1000
                                    field:
                                      type: string
                                      minLength: 1
                                      maxLength: 80
                                      nullable: true
                                  required:
                                    - text
                                  additionalProperties: false
                            maxItems: 20
                        required:
                          - text
                        additionalProperties: false
                    required:
                      - step_index
                      - field
                      - text
                      - label
                      - fill
                    additionalProperties: false
                  maxItems: 20
                needs:
                  type: object
                  properties:
                    fields:
                      type: array
                      items:
                        type: object
                        properties:
                          key:
                            type: string
                            minLength: 1
                            maxLength: 80
                          description:
                            type: string
                            maxLength: 500
                          required:
                            type: boolean
                        required:
                          - key
                          - description
                          - required
                        additionalProperties: false
                      maxItems: 30
                  required:
                    - fields
                  additionalProperties: false
                written_for:
                  type: string
                  maxLength: 4000
                  nullable: true
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
        "400":
          description: Validation error (unknown fields are rejected)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Missing or invalid API key
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
