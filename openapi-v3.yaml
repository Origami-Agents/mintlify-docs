      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                brief:
                  type: string
                  minLength: 1
                  maxLength: 10000
                count:
                  type: integer
                  minimum: 1
                  maximum: 1000
                quality:
                  type: string
                  enum:
                    - fast
                    - accurate
                exclude_list_ids:
                  type: array
                  items:
                    type: string
                    format: uuid
                  minItems: 1
                  maxItems: 20
                metadata:
                  type: object
                  additionalProperties:
                    type: string
                output_schema:
                  type: object
                  additionalProperties: {}
                  description: "A JSON Schema object (\"type\": \"object\" at the top) the run's
                    result must match. The run finishes only once it has
                    submitted a value that matches, and the Job's result.output
                    carries it."
                model:
                  type: string
                  enum:
                    - origami-lite
                    - origami-max
                  description: "How hard the agent thinks: origami-lite (the default) or
                    origami-max, where the plan allows it."
                source:
                  type: string
                  enum:
                    - linkedin_connections
                    - former_customers
                    - website_visitors
                  description: "Draw the leads from one of the account's own warm sources instead
                    of a market search: linkedin_connections (a connected
                    sender's 1st-degree connections), former_customers (from the
                    connected Stripe) or website_visitors (companies seen by the
                    Origami snippet or connected PostHog). The brief then only
                    narrows who to keep. Omit for an ordinary search."
              required:
                - brief
      responses:
        "202":
          description: Job admitted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
