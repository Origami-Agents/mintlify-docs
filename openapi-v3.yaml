    patch:
      x-mint:
        href: /v3/reference/send-campaigns-settings-patch
        metadata:
          title: "Update settings"
          sidebarTitle: "Update settings"
          description: "Patch settings (legal in every status; omitted fields unchanged)"
      operationId: send.campaigns.settings.patch
      summary: Patch settings (legal in every status; omitted fields unchanged)
      tags:
        - send
      parameters:
        - name: campaign_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 200
                channels:
                  type: array
                  items:
                    type: string
                    enum:
                      - email
                      - linkedin
                  minItems: 1
                  maxItems: 2
                  description: "Only settable before the campaign has template steps. Once it
                    does, the template's steps are the channel set: a matching
                    set is accepted as a no-op, a different set is 400
                    VALIDATION_ERROR (change channels through the templates:
                    edit the steps of the shared template behind it with PATCH
                    /send/templates/:template, which on a launched campaign
                    saves a draft that reaches the campaign after POST
                    /send/templates/:template/go-live and /apply; or attach one
                    on other channels with POST
                    /send/templates/:template/attach)"
                send_window:
                  type: object
                  properties:
                    start_hour:
                      type: integer
                      minimum: 0
                      maximum: 23
                    end_hour:
                      type: integer
                      minimum: 0
                      maximum: 23
                    days:
                      type: array
                      items:
                        type: integer
                        minimum: 0
                        maximum: 6
                      minItems: 1
                      maxItems: 7
                    basis:
                      type: string
                      enum:
                        - recipient
                        - sender
                      description: "Whose clock email uses: each person's own zone with the sender's
                        as the fallback (recipient, the default) or the sender's
                        for everyone; LinkedIn always uses the sender's. Omitted
                        on a write keeps the stored choice"
                  required:
                    - start_hour
                    - end_hour
                    - days
                  additionalProperties: false
                  description: start_hour is inclusive, end_hour exclusive (0 = end of day);
                    cross-midnight windows (start_hour > end_hour) are legal
                  nullable: true
                block_active_duplicates:
                  type: boolean
                block_prior_contacts:
                  type: boolean
                auto_lead_refill_enabled:
                  type: boolean
                auto_lead_refill_budget_credits:
                  type: integer
                  minimum: 0
                  nullable: true
                require_message_approval:
                  type: boolean
                allow_excluded_recipients:
                  type: boolean
                block_already_connected:
                  type: boolean
                cross_channel_fallback:
                  type: string
                  enum:
                    - use_other_sender
                    - skip_channel
                  description: Deprecated and ignored. A channel the lead's sender has no account
                    on is always sent by another sender in the campaign. Still
                    accepted so existing calls keep working
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
        "400":
          description: Validation error (unknown fields are rejected)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
