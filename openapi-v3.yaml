components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: "API key: Authorization: Bearer og_live_..."
  schemas:
    Error:
      type: object
      description: Closed error envelope — no additional top-level keys.
      additionalProperties: false
      properties:
        error:
          type: string
        code:
          type: string
          description: UPPER_SNAKE_CASE machine code
        details:
          type: object
        handoff:
          type: object
          description: In-app recovery link when the user can fix the situation in the
            dashboard
          properties:
            kind:
              type: string
              enum:
                - connect-accounts
                - reconnect-account
                - billing
                - upgrade-plan
                - sca-confirm
            url:
              type: string
            label:
              type: string
      required:
        - error
        - code
    Job:
      type: object
      description: Shared Job resource returned by every async operation. Poll GET
        /jobs/{job_id} honoring next_poll_at, or subscribe to job.* webhooks.
      properties:
        object:
          type: string
          enum:
            - job
        id:
          type: string
          format: uuid
        operation:
          type: string
          description: Catalog operation id
        status:
          type: string
          enum:
            - queued
            - running
            - needs_input
            - succeeded
            - failed
            - cancelled
        cancel_requested:
          type: boolean
        phase:
          type: string
          enum:
            - researching
            - fetching
            - enriching
            - drafting
            - rendering
          nullable: true
        progress:
          type: object
          nullable: true
          properties:
            done:
              type: integer
            total:
              type: integer
        target:
          type: object
          nullable: true
          properties:
            type:
              type: string
              enum:
                - list
                - search
                - campaign
                - chat
                - domain_order
            id:
              type: string
        metadata:
          type: object
          nullable: true
          additionalProperties:
            type: string
        next_poll_at:
          type: string
          format: date-time
          nullable: true
        result:
          type: object
          nullable: true
        credits:
          type: object
          nullable: true
          description: This Job's credit totals; null for non-spending operations. settled
            flips true after delivered-lead settlement writes back.
          properties:
            spent:
              type: number
            settled:
              type: boolean
        error:
          type: object
          nullable: true
          properties:
            code:
              type: string
            message:
              type: string
            details:
              type: object
        needs_input:
          type: object
          nullable: true
        chat_id:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    SequenceStatus:
      type: string
      description: Derived per-person sequence status vocabulary (people list `status`
        filter).
      enum:
        - draft
        - scheduled
        - sending
        - sent
        - accepted
        - failed
        - blocked
        - stopped
        - awaiting_accept
        - skipped
        - ongoing
        - replied
        - deleted
        - cancelled
        - needs_recipient
        - no_messaging
        - paused
        - needs_sender
        - out_of_office
        - sender_disconnected
        - bounced
        - unsubscribed
        - you_messaged_them
        - not_accepted
        - disqualified
        - excluded
        - migration_held
        - awaiting_approval
        - removed
        - not_a_fit
        - duplicate
        - already_contacted
        - campaign_deleted
